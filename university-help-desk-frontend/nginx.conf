server {
    listen 8000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # вложения до 5 МБ + служебные поля multipart
    client_max_body_size 6m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    # DNS Docker; backend определяется при запросе, а не при старте nginx
    resolver 127.0.0.11 valid=10s;

    location /api/ {
        set $backend http://backend:5000;
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api-docs {
        set $backend http://backend:5000;
        proxy_pass $backend;
        proxy_set_header Host $host;
    }

    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # SPA: любые неизвестные пути отдают index.html (маршрутизация на клиенте)
    location / {
        try_files $uri /index.html;
    }
}
